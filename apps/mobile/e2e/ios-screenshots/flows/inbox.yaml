appId: com.kith.agent
name: Inbox
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- extendedWaitUntil:
    visible: ".*Researcher.*"
    timeout: 20000
- takeScreenshot: 01-inbox
- assertNotVisible: "Activity"
- longPressOn: ".*Writer.*"
- assertVisible: "Pin"
- assertVisible: "Label"
- assertVisible: "Delete"
- takeScreenshot: 02-chat-menu
- tapOn: "Pin"
- extendedWaitUntil:
    visible: ".*Writer.*Pinned.*"
    timeout: 15000
- takeScreenshot: 02b-pinned-chat
- longPressOn: ".*Writer.*Pinned.*"
- tapOn: "Unpin"
- tapOn: "Create"
- assertVisible: "New bot"
- assertVisible: "New group"
- assertVisible: "New space"
- takeScreenshot: 02c-create-menu
- tapOn: "New bot"
- extendedWaitUntil:
    visible: "What should my name be, and what's my role?"
    timeout: 30000
- tapOn: "Miso, Inbox assistant"
- extendedWaitUntil:
    visible: "Message Miso"
    timeout: 30000
- assertVisible: "What should I help you with first?"
- openLink: "rakazo:///"
- openLink: "rakazo:///artifacts"
- extendedWaitUntil:
    visible: ".*launch-notes.txt.*|.*No artifacts yet.*|.*Artifacts.*"
    timeout: 15000
- takeScreenshot: 03-artifacts
