appId: com.kith.agent
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      RAKAZO_ACTIVE_EMAIL: ${RAKAZO_SCREENSHOT_EMAIL}
- openLink: "rakazo:///new"
- extendedWaitUntil:
    visible: "What should my name be, and what's my role?"
    timeout: 15000
- takeScreenshot: 01-new-bot
- tapOn: "Custom"
# Custom focuses the native Name field; input IDs are not exposed by iOS accessibility.
- inputText: "Atlas"
# Next transfers keyboard focus to Role without matching its static label.
- pressKey: Enter
- inputText: "Research lead"
- takeScreenshot: 01b-custom-identity
# Done submits the explicit identity. Do not tap a Save control that has already disappeared.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Message Atlas"
    timeout: 30000
- assertVisible: "What should I help you with first?"
- takeScreenshot: 01c-focus-choice
- openLink: "rakazo:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "rakazo:///new-group"
- extendedWaitUntil:
    visible: "Name this group"
    timeout: 15000
- takeScreenshot: 03-new-group
- openLink: "rakazo:///"
