appId: com.kith.agent
name: Fresh introduction and first assistant
---
# Use a disposable simulator: iOS Keychain clearing affects the entire simulator.
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: unset
- extendedWaitUntil:
    visible: "Meet Kith."
    timeout: 30000
- takeScreenshot: 01-meet-kith
- tapOn: "Continue"
- assertVisible: "Hand off the work."
- takeScreenshot: 02-hand-off
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Hand off the work."
    timeout: 30000
- tapOn: "Continue"
- assertVisible: "Pick up where you left off."
- takeScreenshot: 03-return-to-results
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Sign up for Kith"
    timeout: 15000
- takeScreenshot: 04-auth
- runFlow: ../subflows/custom-server.yaml
# This account has no bots; preparation must not require manual bot creation.
- tapOn: "Sign in"
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMPTY_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: ".*Kith.*Pinned.*"
    timeout: 30000
- takeScreenshot: 05-first-inbox
- tapOn: ".*Kith.*Pinned.*"
- extendedWaitUntil:
    visible: "What should I help you with first\\?"
    timeout: 30000
- takeScreenshot: 05-first-assistant
- tapOn: "Organize my day"
- extendedWaitUntil:
    notVisible: "Email and follow-ups"
    timeout: 15000
- takeScreenshot: 06-focus-selected
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Account"
    timeout: 30000
- assertNotVisible: "Meet Kith."
