appId: com.kith.agent
---
# Restart without clearing app data, so a dev client's bundler URL stays put.
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Meet Kith.|Hand off the work.|Pick up where you left off.|Account|Sign up for Kith|Sign in to Kith"
    timeout: 40000
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- runFlow:
    when:
      visible: "Account"
    commands:
      - tapOn: "Account"
      - scrollUntilVisible:
          element: "Sign out"
          direction: DOWN
          timeout: 15000
      - tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign up for Kith|Sign in to Kith"
    timeout: 20000
