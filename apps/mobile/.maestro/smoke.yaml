appId: com.kith.agent
name: Kith mobile smoke
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "Sign up for Kith"
    timeout: 30000
- assertVisible: "Name"
- tapOn: "Sign in"
- assertVisible: "Sign in to Kith"
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "Message Researcher"
    timeout: 30000
- tapOn: "Message Researcher"
- inputText: "Mobile acceptance hello"
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*done. i handled: Mobile acceptance hello.*"
    timeout: 30000
- stopApp
- launchApp:
    clearState: false
- assertNotVisible: "Sign in to Kith"
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*done. i handled: Mobile acceptance hello.*"
    timeout: 30000
# Keep bot creation and native computer ownership coverage from the original smoke.
- openLink: "rakazo:///new"
- extendedWaitUntil:
    visible: "Name this bot"
    timeout: 10000
- tapOn: "Name this bot"
- inputText: "Acceptance Bot"
- hideKeyboard
- tapOn: "Create"
- extendedWaitUntil:
    visible: "Message Acceptance Bot"
    timeout: 30000
- tapOn: "Message Acceptance Bot"
- inputText: "Native bot acceptance"
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*done. i handled: Native bot acceptance.*"
    timeout: 30000
- tapOn: "Bot actions"
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "Open computer"
    timeout: 30000
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 30000
- tapOn: "Take control"
- extendedWaitUntil:
    visible: "You have control"
    timeout: 90000
- tapOn: "Close computer"
- tapOn: "Release"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 30000
- openLink: "rakazo:///for-you"
- extendedWaitUntil:
    visible: "For you"
    timeout: 10000
- openLink: "rakazo:///account"
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 10000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in to Kith"
    timeout: 10000
