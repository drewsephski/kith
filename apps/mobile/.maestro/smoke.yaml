appId: com.kith.agent
name: Kith mobile smoke
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      notifications: deny
- runFlow:
    file: subflows/cold-introduction.yaml
    env:
      NOTIFICATIONS_PERMISSION: deny
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Sign in to Kith"
    timeout: 30000
- runFlow: ../e2e/ios-screenshots/subflows/custom-server.yaml
- tapOn: "Sign up"
- extendedWaitUntil:
    visible: "Sign up for Kith"
    timeout: 30000
- assertVisible: "Name"
- tapOn: "Sign in"
- assertVisible: "Sign in to Kith"
- tapOn: "Email"
- inputText: ${RAKAZO_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${RAKAZO_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Researcher"
    timeout: 30000
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "Message Researcher"
    timeout: 30000
- tapOn: "Message Researcher"
- inputText: "Mobile acceptance hello"
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*done. i handled: Mobile acceptance hello.*"
    timeout: 30000
- stopApp
- launchApp:
    clearState: false
- assertNotVisible: "Sign in to Kith"
- openLink: "rakazo:///thread?botId=${RAKAZO_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: ".*done. i handled: Mobile acceptance hello.*"
    timeout: 30000
# Conversational identity is saved before the established focus question.
- openLink: "rakazo:///new"
- extendedWaitUntil:
    visible: "What should my name be, and what's my role?"
    timeout: 30000
- assertNotVisible: "What should I help you with first?"
- assertVisible: "Miso, Inbox assistant"
- assertVisible: "Pippin, Research assistant"
- assertVisible: "Orbit, Planning assistant"
- assertVisible: "Pixel, Coding partner"
- tapOn: "Custom"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "bot-identity-name"
      - inputText: "Acceptance Bot"
      - tapOn:
          id: "bot-identity-role"
      - inputText: "Research assistant"
      - hideKeyboard
      - tapOn: "Save"
- runFlow:
    when:
      platform: iOS
    commands:
      - inputText: "Acceptance Bot"
      - pressKey: Enter
      - inputText: "Research assistant"
      - pressKey: Enter
- extendedWaitUntil:
    visible: "Message Acceptance Bot"
    timeout: 30000
- assertNotVisible: "What should my name be, and what's my role?"
- assertVisible: "What should I help you with first?"
- tapOn: "Just start chatting"
- stopApp
- launchApp:
    clearState: false
- runFlow:
    when:
      notVisible: "Message Acceptance Bot"
    commands:
      - extendedWaitUntil:
          visible: "Acceptance Bot"
          timeout: 30000
      - tapOn: "Acceptance Bot"
- extendedWaitUntil:
    visible: "Message Acceptance Bot"
    timeout: 30000
- tapOn: "Message Acceptance Bot"
- inputText: "Native bot acceptance"
- hideKeyboard
- tapOn: "Send"
- extendedWaitUntil:
    visible: ".*done. i handled: Native bot acceptance.*"
    timeout: 30000
- tapOn: "Bot actions"
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "Start computer|Open computer"
    timeout: 30000
# A new bot can share the team computer already started by earlier flows.
# Start from the overview when stopped; otherwise open its current session.
- runFlow:
    when:
      visible: "Start computer"
    commands:
      - tapOn: "Start computer"
- runFlow:
    when:
      visible: "Open computer"
    commands:
      - tapOn: "Open computer"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 90000
- tapOn: "Take control"
- extendedWaitUntil:
    visible: "You have control"
    timeout: 90000
- tapOn: "Close computer"
- tapOn: "Release"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 30000
- openLink: "rakazo:///for-you"
- extendedWaitUntil:
    visible: "For you"
    timeout: 10000
- openLink: "rakazo:///account"
- scrollUntilVisible:
    element: "Sign out"
    direction: DOWN
- extendedWaitUntil:
    visible: "Sign out"
    timeout: 10000
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in to Kith"
    timeout: 10000
