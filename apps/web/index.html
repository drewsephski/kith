<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Your personal assistant. Remember your life, get work done, and see what happened." />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="apple-mobile-web-app-title" content="Kith" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Kith</title>
    <script>
      (() => {
        const key = "rakazo.uiAppearance";
        let preference = "system";
        try {
          const stored = localStorage.getItem(key);
          if (stored === "system" || stored === "light" || stored === "dark") preference = stored;
        } catch {}
        const systemLight =
          typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: light)").matches;
        const theme = preference === "system" ? (systemLight ? "light" : "dark") : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#fbfaf7" : "#0b0c0e");
      })();
    </script>
  </head>
  <body>
